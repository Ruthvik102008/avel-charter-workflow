name: Verify charter workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run and verify the demo
        run: python verify.py
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify desktop and mobile browser flows
        run: node tests/browser.cjs
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CLI and request locking on Windows
        run: python verify.py
